packages:
  - .

# Public DSH packages are the default development dependencies. The optional
# dsh:link scripts replace them with an explicitly selected source checkout.
autoInstallPeers: false
verifyDepsBeforeRun: false

allowBuilds:
  esbuild: true

# DSH rc8 was verified as one coordinated official release. Admit only the
# exact package set while it is newer than the repository's age policy.
minimumReleaseAgeExclude:
  - '@deepseek-ai/cordis@4.0.1'
  - '@deepseek-ai/cosmokit@1.8.2'
  - '@deepseek-ai/dsh-api-gateway@0.1.0-rc.8'
  - '@deepseek-ai/dsh-attachment@0.1.0-rc.8'
  - '@deepseek-ai/dsh-brand@0.1.0-rc.8'
  - '@deepseek-ai/dsh-client-locale@0.1.0-rc.8'
  - '@deepseek-ai/dsh-client-runtime@0.1.0-rc.8'
  - '@deepseek-ai/dsh-client-ui-conversation@0.1.0-rc.8'
  - '@deepseek-ai/dsh-client-ui-primitives@0.1.0-rc.8'
  - '@deepseek-ai/dsh-client-ui-settings@0.1.0-rc.8'
  - '@deepseek-ai/dsh-client-ui-slots@0.1.0-rc.8'
  - '@deepseek-ai/dsh-commands@0.1.0-rc.8'
  - '@deepseek-ai/dsh-invariants@0.1.0-rc.8'
  - '@deepseek-ai/dsh-llm@0.1.0-rc.8'
  - '@deepseek-ai/dsh-scope@0.1.0-rc.8'
  - '@deepseek-ai/dsh-session@0.1.0-rc.8'
  - '@deepseek-ai/dsh-settings@0.1.0-rc.8'
  - '@deepseek-ai/dsh-timeout@0.1.0-rc.8'
  - '@deepseek-ai/dsh-token-meter@0.1.0-rc.8'
  - '@deepseek-ai/dsh-typert-generator@0.1.0-rc.8'
  - '@deepseek-ai/dsh-typert-protocol@0.1.0-rc.8'
  - '@deepseek-ai/schemastery@3.18.1'
