name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2.1.0
        with:
          install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm pack --dry-run

  assembled:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 0.1.2-rc.1
            sha: a66e4702047846cdaa10c66c9d3df3951f5ea70d
          - version: 0.1.3-alpha.1
            sha: d347e703908d0406b7a7ef80e3a0e594d86b2215
          - version: 0.1.3-alpha.2
            sha: 82a5fd61a7cf5c293cec4bdff68f455398d685e9
          - version: 0.1.5-alpha.1
            sha: 5dda764ed3aa172535a7967b06ff95d9cbfe536a
          - version: 0.1.5-alpha.2
            sha: b2e3b2a0125854567a4a5fcba75782e42fe84901
          - version: 0.1.5-rc.1
            sha: 183f08e9c6dde7e36cd2318eaee70b0da08fb35e
          - version: 0.1.5-rc.2
            sha: fb2c4b9e698e30edb738bca4cf0618587db7d203
    name: DSH ${{ matrix.version }}
    env:
      DSH_SOURCE_DIR: ${{ github.workspace }}/.dsh-source
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ matrix.sha }}
          path: .dsh-source
      - uses: pnpm/setup@v2.1.0
        with:
          install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            .dsh-source/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: .dsh-source
      - run: pnpm build
        working-directory: .dsh-source
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm dsh:link
      - run: pnpm dsh:link:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec vitest run --config vitest.web.config.ts
      - run: pnpm exec vitest run --config vitest.m6.config.ts
