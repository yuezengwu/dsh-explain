name: Feature request
description: Propose one user outcome and its privacy/cost boundary.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: What becomes difficult or impossible today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the observable result rather than an implementation.
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Privacy, cost, and persistence effects
      description: Note any new stored data, model calls, deletion/import behavior, or DSH compatibility impact.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: I searched existing issues and pull requests for this request.
          required: true
        - label: This request does not contain private Session or learning data.
          required: true
